name: Check pending video renders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check-renders:
    runs-on: ubuntu-latest
    steps:
      - name: Ping process-pending endpoint
        run: |
          curl -s -X GET "https://ai-business-os-sigma-six.vercel.app/api/pipeline/process-pending" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
